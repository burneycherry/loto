name: テストとみずほ当せん番号の取得

on:
  # push は既定ブランチ以外でも動きます（schedule と workflow_dispatch は
  # 既定ブランチのワークフローしか動かないため、ブランチでの検証用に入れています）。
  # GITHUB_TOKEN による push は再度ワークフローを起動しないので、繰り返しにはなりません。
  push:
  schedule:
    # 12:00 UTC = 21:00 JST（ロト6は月・木、ロト7は金に抽せん。毎日確認します）
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-loto-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: テスト
        run: |
          node tools/test_app.js
          LOTO_SLEEP=0 node tools/test_parse.js

      # みずほは GitHub Actions のIPからの接続を 403 で拒否します。
      # push のたびに失敗するのを避けるため、取得は手動実行と定期実行のときだけ行います。
      - name: 当せん番号を取得
        if: github.event_name != 'push'
        run: node tools/fetch_mizuho.js both data 120

      - name: 変更があればコミット
        if: github.event_name != 'push'
        run: |
          if [ -n "$(git status -s data)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data
            git commit -m "データ更新: みずほ当せん番号 ($(date -u +%Y/%m/%d))"
            git push origin HEAD:"${GITHUB_REF_NAME}"
            echo "コミットしました"
          else
            echo "変更なし"
          fi
