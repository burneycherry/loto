<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ロト統計">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f172a">
<title>ロト統計アナライザー</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="icon" href="icon.svg">
<style>
* { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  background: #eef1f6;
  color: #182027;
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", "Segoe UI", sans-serif;
  font-size: 15px;
  line-height: 1.6;
  -webkit-text-size-adjust: 100%;
}
body {
  min-height: 100vh;
  padding-bottom: calc(76px + env(safe-area-inset-bottom));
}
header.app {
  position: sticky;
  top: 0;
  z-index: 20;
  background: #0f172a;
  color: #f2f5fa;
  padding: calc(8px + env(safe-area-inset-top)) 14px 10px;
  box-shadow: 0 2px 10px rgba(15, 23, 42, 0.25);
}
.hrow { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.title { font-size: 17px; font-weight: 700; letter-spacing: 0.02em; }
.ver {
  font-size: 11px;
  font-weight: 600;
  background: #1e293b;
  color: #9fd0ff;
  border: 1px solid #334155;
  border-radius: 999px;
  padding: 2px 9px;
  white-space: nowrap;
}
.seg { display: flex; gap: 6px; margin-top: 9px; }
.seg button {
  flex: 1;
  appearance: none;
  border: 1px solid #33415a;
  background: #172033;
  color: #c7d3e6;
  border-radius: 10px;
  padding: 7px 4px;
  font-size: 14px;
  font-weight: 600;
  font-family: inherit;
}
.seg button.on { background: #2563eb; border-color: #2563eb; color: #ffffff; }
main { padding: 12px 12px 8px; max-width: 760px; margin: 0 auto; }
.card {
  background: #ffffff;
  border: 1px solid #dfe5ee;
  border-radius: 14px;
  padding: 13px 13px 15px;
  margin-bottom: 12px;
  box-shadow: 0 1px 3px rgba(16, 24, 40, 0.06);
}
h2.sec {
  margin: 0 0 10px;
  font-size: 15px;
  font-weight: 700;
  color: #0f172a;
  border-left: 4px solid #2563eb;
  padding-left: 8px;
  line-height: 1.3;
}
h3.sub { margin: 16px 0 7px; font-size: 14px; font-weight: 700; color: #1d4ed8; }
h3.sub:first-child { margin-top: 2px; }
p.note { margin: 6px 0 0; font-size: 12px; color: #5b6774; }
.muted { color: #5b6774; }
.warn {
  background: #fff7e6;
  border: 1px solid #f0c987;
  color: #7a4d00;
  border-radius: 10px;
  padding: 9px 11px;
  font-size: 13px;
  margin-bottom: 12px;
}
.empty { text-align: center; color: #5b6774; padding: 18px 6px; font-size: 14px; }
button.btn {
  appearance: none;
  font-family: inherit;
  font-size: 14px;
  font-weight: 600;
  border-radius: 10px;
  border: 1px solid #2563eb;
  background: #2563eb;
  color: #ffffff;
  padding: 10px 14px;
  margin: 4px 6px 4px 0;
  min-height: 42px;
}
button.btn.sub { background: #ffffff; color: #2563eb; }
button.btn.gray { background: #ffffff; color: #475569; border-color: #cbd5e1; }
button.btn.danger { background: #ffffff; color: #b91c1c; border-color: #e7b3b3; }
button.btn.wide { width: 100%; margin-right: 0; }
button.mini {
  appearance: none;
  font-family: inherit;
  font-size: 12px;
  border-radius: 8px;
  border: 1px solid #cbd5e1;
  background: #ffffff;
  color: #475569;
  padding: 4px 8px;
}
textarea, input[type="text"], input[type="number"], select {
  font-family: inherit;
  font-size: 16px;
  width: 100%;
  border: 1px solid #c8d2e0;
  border-radius: 10px;
  padding: 9px 10px;
  background: #ffffff;
  color: #182027;
}
textarea { min-height: 130px; line-height: 1.5; }
label.fld { display: block; font-size: 12px; font-weight: 600; color: #47546b; margin: 10px 0 4px; }
.row2 { display: flex; gap: 8px; flex-wrap: wrap; }
.row2 > div { flex: 1 1 130px; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; margin: 4px 0; }
.chip {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 34px;
  height: 32px;
  padding: 0 7px;
  border-radius: 9px;
  background: #eef2f8;
  border: 1px solid #d7deea;
  font-size: 14px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  color: #1f2937;
}
.chip.b { background: #fdecef; border-color: #f2c3cd; color: #a3123a; }
.chip.h4 { background: #b91c1c; border-color: #b91c1c; color: #ffffff; }
.chip.h3 { background: #f97316; border-color: #f97316; color: #ffffff; }
.chip.h2 { background: #fde68a; border-color: #f2d27a; color: #713f12; }
.chip.h1 { background: #dbeafe; border-color: #bfdbfe; color: #1e40af; }
.chip.h0 { background: #f1f5f9; border-color: #dbe2ea; color: #64748b; }
.chip.pick {
  min-width: 40px;
  height: 38px;
  font-size: 16px;
  background: #1d4ed8;
  border-color: #1d4ed8;
  color: #ffffff;
}
table.tb { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 6px; }
table.tb th, table.tb td {
  border-bottom: 1px solid #e6ebf2;
  padding: 6px 5px;
  text-align: right;
  font-variant-numeric: tabular-nums;
}
table.tb th {
  background: #f4f7fb;
  color: #47546b;
  font-weight: 600;
  text-align: right;
  position: sticky;
  top: 0;
}
table.tb th:first-child, table.tb td:first-child { text-align: left; }
table.tb td.l, table.tb th.l { text-align: left; }
.scroll { max-height: 420px; overflow: auto; border: 1px solid #e6ebf2; border-radius: 10px; }
.bar { height: 7px; border-radius: 4px; background: #e3e9f2; overflow: hidden; min-width: 40px; }
.bar > i { display: block; height: 100%; background: #2563eb; }
.kpi { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 2px; }
.kpi > div {
  flex: 1 1 110px;
  background: #f5f8fc;
  border: 1px solid #e2e9f3;
  border-radius: 11px;
  padding: 8px 10px;
}
.kpi b { display: block; font-size: 18px; color: #0f172a; font-variant-numeric: tabular-nums; }
.kpi span { font-size: 11px; color: #5b6774; }
.dist { margin: 6px 0 0; }
.dist > div {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  padding: 7px 0;
  border-bottom: 1px dashed #e3e9f2;
  flex-wrap: wrap;
}
.dist .lb {
  flex: 0 0 auto;
  font-weight: 700;
  font-size: 13px;
  color: #0f172a;
  background: #eef2f8;
  border-radius: 8px;
  padding: 3px 8px;
}
.pickrow {
  border: 1px solid #dbe3ef;
  border-radius: 12px;
  padding: 9px 10px;
  margin-bottom: 9px;
  background: #fbfdff;
}
.pickrow .meta { font-size: 11.5px; color: #5b6774; margin-top: 5px; }
.pickrow .idx { font-size: 12px; font-weight: 700; color: #1d4ed8; }
nav.tabs {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 30;
  display: flex;
  background: #ffffff;
  border-top: 1px solid #dde3ec;
  padding-bottom: env(safe-area-inset-bottom);
}
nav.tabs button {
  flex: 1;
  appearance: none;
  border: 0;
  background: transparent;
  font-family: inherit;
  font-size: 10.5px;
  font-weight: 600;
  color: #68758a;
  padding: 8px 2px 9px;
  line-height: 1.25;
}
nav.tabs button em { display: block; font-size: 18px; font-style: normal; }
nav.tabs button.on { color: #2563eb; }
.inline { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.checks { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 6px; }
.checks label { font-size: 13px; display: inline-flex; align-items: center; gap: 5px; }
code.sm { background: #f1f5f9; border-radius: 5px; padding: 1px 5px; font-size: 12px; }
@media (prefers-color-scheme: dark) {
  html, body { background: #0b0f16; color: #e4e9f0; }
  .card { background: #151b25; border-color: #26303f; box-shadow: none; }
  h2.sec { color: #e9eef6; }
  h3.sub { color: #7fb0ff; }
  p.note, .muted, .kpi span { color: #93a2b8; }
  .empty { color: #93a2b8; }
  .warn { background: #33270d; border-color: #6b551f; color: #f4d99b; }
  textarea, input[type="text"], input[type="number"], select {
    background: #0f141d;
    color: #e4e9f0;
    border-color: #2c3746;
  }
  label.fld { color: #9fb0c7; }
  button.btn.sub { background: #101722; color: #7fb0ff; border-color: #2c4a7a; }
  button.btn.gray { background: #101722; color: #a8b6c9; border-color: #2c3746; }
  button.btn.danger { background: #101722; color: #f28b8b; border-color: #6b2b2b; }
  button.mini { background: #101722; color: #a8b6c9; border-color: #2c3746; }
  .chip { background: #1b2432; border-color: #2c3746; color: #dde5ef; }
  .chip.b { background: #3a1522; border-color: #6d2a3d; color: #ffc0cf; }
  .chip.h4 { background: #b91c1c; border-color: #b91c1c; color: #ffffff; }
  .chip.h3 { background: #c2610c; border-color: #c2610c; color: #ffffff; }
  .chip.h2 { background: #7a5c12; border-color: #8a6a18; color: #ffe9a8; }
  .chip.h1 { background: #12315e; border-color: #1c467f; color: #cbe0ff; }
  .chip.h0 { background: #161d28; border-color: #263041; color: #7f8ca0; }
  .chip.pick { background: #2563eb; border-color: #2563eb; color: #ffffff; }
  table.tb th { background: #182130; color: #9fb0c7; }
  table.tb th, table.tb td { border-bottom-color: #232d3c; }
  .scroll { border-color: #26303f; }
  .bar { background: #202a39; }
  .kpi > div { background: #111925; border-color: #26303f; }
  .kpi b { color: #eaf0f8; }
  .dist .lb { background: #1b2432; color: #e4e9f0; }
  .dist > div { border-bottom-color: #232d3c; }
  .pickrow { background: #111925; border-color: #26303f; }
  nav.tabs { background: #101723; border-top-color: #26303f; }
  nav.tabs button { color: #8b99ad; }
  nav.tabs button.on { color: #7fb0ff; }
  code.sm { background: #1b2432; }
}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function () {
  'use strict';

  var APP_VERSION = '1.53';
  var STORE_KEY = 'lotoStatsApp.v1';

  var GAMES = {
    loto6: { key: 'loto6', label: 'ロト6', max: 43, main: 6, bonus: 1 },
    loto7: { key: 'loto7', label: 'ロト7', max: 37, main: 7, bonus: 2 }
  };

  var TABS = [
    { key: 'data', icon: '⌨', label: 'データ' },
    { key: 'freq', icon: '①', label: '出現率' },
    { key: 'cond', icon: '②', label: '条件確率' },
    { key: 'pred', icon: '◎', label: '予想' },
    { key: 'info', icon: 'i', label: '情報' }
  ];

  var state = {
    game: 'loto6',
    tab: 'data',
    windowSize: 24,
    carryWithBonus: false,
    freqTarget: 'main',
    freqSort: 'num',
    bandMode: 'auto',
    bandHot: 2,
    bandMid: 3,
    bandCold: 1,
    predictCount: 5,
    useCarry: true,
    useConsec: true,
    useTail: true,
    useSum: true,
    useOdd: true,
    pasteOrder: 'auto',
    data: { loto6: [], loto7: [] }
  };

  var pasteText = '';
  var lastPicks = null;

  function $(id) { return document.getElementById(id); }
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      if (c === '&') { return '&amp;'; }
      if (c === '<') { return '&lt;'; }
      if (c === '>') { return '&gt;'; }
      return '&quot;';
    });
  }
  function fx(v, k) {
    if (!isFinite(v)) { return '0'; }
    return v.toFixed(k);
  }
  function rate(n, d) { return d > 0 ? (n / d) * 100 : 0; }
  function sum(arr) {
    var t = 0;
    for (var i = 0; i < arr.length; i++) { t += arr[i]; }
    return t;
  }
  function asc(a, b) { return a - b; }

  function save() {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify({
        v: APP_VERSION,
        game: state.game,
        windowSize: state.windowSize,
        carryWithBonus: state.carryWithBonus,
        freqTarget: state.freqTarget,
        freqSort: state.freqSort,
        bandMode: state.bandMode,
        bandHot: state.bandHot,
        bandMid: state.bandMid,
        bandCold: state.bandCold,
        predictCount: state.predictCount,
        useCarry: state.useCarry,
        useConsec: state.useConsec,
        useTail: state.useTail,
        useSum: state.useSum,
        useOdd: state.useOdd,
        pasteOrder: state.pasteOrder,
        data: state.data
      }));
    } catch (e) { /* 保存できない環境では無視 */ }
  }

  function load() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (!raw) { return; }
      var o = JSON.parse(raw);
      if (!o || typeof o !== 'object') { return; }
      var keys = ['game', 'windowSize', 'carryWithBonus', 'freqTarget', 'freqSort',
        'bandMode', 'bandHot', 'bandMid', 'bandCold',
        'predictCount', 'useCarry', 'useConsec', 'useTail',
        'useSum', 'useOdd', 'pasteOrder'];
      for (var i = 0; i < keys.length; i++) {
        if (typeof o[keys[i]] !== 'undefined') { state[keys[i]] = o[keys[i]]; }
      }
      if (o.data) {
        if (Array.isArray(o.data.loto6)) { state.data.loto6 = o.data.loto6; }
        if (Array.isArray(o.data.loto7)) { state.data.loto7 = o.data.loto7; }
      }
    } catch (e) { /* 壊れた保存データは無視 */ }
  }

  function g() { return GAMES[state.game]; }
  function draws() { return state.data[state.game]; }

  function winSize() {
    var all = draws();
    if (state.windowSize === 0) { return all.length; }
    return Math.min(state.windowSize, all.length);
  }

  function windowDraws() { return draws().slice(0, winSize()); }

  function drawKey(d) {
    if (typeof d.no === 'number' && isFinite(d.no)) { return 'n' + d.no; }
    return 'k' + d.main.slice().sort(asc).join('-') + '|' + d.bonus.slice().sort(asc).join('-');
  }

  function sortDraws(list) {
    var allNo = list.length > 0;
    for (var i = 0; i < list.length; i++) {
      if (typeof list[i].no !== 'number' || !isFinite(list[i].no)) { allNo = false; }
    }
    if (allNo) {
      list.sort(function (a, b) { return b.no - a.no; });
    }
    return list;
  }

  function zen2han(str) {
    return String(str).replace(/[０-９]/g, function (c) {
      return String.fromCharCode(c.charCodeAt(0) - 0xFEE0);
    });
  }

  function numbersIn(text, game, want) {
    var found = [];
    var seen = {};
    var re = /\d+/g;
    var m;
    while ((m = re.exec(text)) !== null) {
      var v = Number(m[0]);
      if (v < 1 || v > game.max) { continue; }
      if (seen[v]) { continue; }
      seen[v] = 1;
      found.push(v);
      if (found.length >= want) { break; }
    }
    return found;
  }

  /*
   * みずほの「抽せん数字一覧表」をそのままコピーした文章のように、
   * 1回分が複数行にまたがる形式から当せん番号を取り出します。
   */
  function parseBlocks(text, game) {
    var t = zen2han(text);
    var re = /第\s*(\d{1,4})\s*回/g;
    var marks = [];
    var m;
    while ((m = re.exec(t)) !== null) {
      marks.push({ no: Number(m[1]), at: m.index, end: m.index + m[0].length });
    }
    var out = [];
    for (var i = 0; i < marks.length; i++) {
      var no = marks[i].no;
      if (!(no >= 1 && no <= 9999)) { continue; }
      var stop = i + 1 < marks.length ? marks[i + 1].at : t.length;
      var block = t.slice(marks[i].end, Math.min(stop, marks[i].end + 1200));
      var dm = block.slice(0, 200).match(/(\d{4})\s*[年\/\.\-]\s*(\d{1,2})\s*[月\/\.\-]\s*(\d{1,2})\s*日?/);
      var main = null;
      var bonus = null;
      var iMain = block.search(/本数字/);
      var iBonus = block.search(/ボーナス/);
      if (iMain >= 0 && iBonus > iMain) {
        main = numbersIn(block.slice(iMain + 3, iBonus), game, game.main);
        var tail = block.slice(iBonus);
        var cut = tail.search(/[等円口]/);
        if (cut > 0) { tail = tail.slice(0, cut); }
        bonus = numbersIn(tail, game, game.bonus);
      } else if (dm) {
        var body = block.slice(block.indexOf(dm[0]) + dm[0].length);
        var cut2 = body.search(/[等円]/);
        if (cut2 > 0) { body = body.slice(0, cut2); }
        var all = numbersIn(body, game, game.main + game.bonus);
        if (all.length === game.main + game.bonus) {
          main = all.slice(0, game.main);
          bonus = all.slice(game.main);
        }
      }
      if (!main || !bonus) { continue; }
      if (main.length !== game.main || bonus.length !== game.bonus) { continue; }
      var seen = {};
      var joined = main.concat(bonus);
      var ok = true;
      for (var j = 0; j < joined.length; j++) {
        if (seen[joined[j]]) { ok = false; break; }
        seen[joined[j]] = 1;
      }
      if (!ok) { continue; }
      out.push({
        no: no,
        date: dm ? (dm[1] + '-' + pad2(Number(dm[2])) + '-' + pad2(Number(dm[3]))) : null,
        main: main.sort(asc),
        bonus: bonus.sort(asc)
      });
    }
    return out;
  }

  function parseDraws(text, game) {
    var lines = String(text).split(/\r?\n/);
    var out = [];
    var errs = [];
    var need = game.main + game.bonus;
    for (var i = 0; i < lines.length; i++) {
      var line = lines[i].replace(/[０-９]/g, function (c) {
        return String.fromCharCode(c.charCodeAt(0) - 0xFEE0);
      });
      if (!/\d/.test(line)) { continue; }
      var no = null;
      var date = null;
      var mNo = line.match(/第\s*(\d{1,5})\s*回/);
      if (mNo) { no = parseInt(mNo[1], 10); line = line.replace(mNo[0], ' '); }
      var mDate = line.match(/(\d{4})\s*[年\/\.\-]\s*(\d{1,2})\s*[月\/\.\-]\s*(\d{1,2})\s*日?/);
      if (mDate) {
        date = mDate[1] + '-' + pad2(parseInt(mDate[2], 10)) + '-' + pad2(parseInt(mDate[3], 10));
        line = line.replace(mDate[0], ' ');
      }
      var nums = line.match(/\d+/g);
      if (!nums) { continue; }
      nums = nums.map(Number);
      if (nums.length < need) {
        errs.push((i + 1) + '行目: 数字が' + nums.length + '個しかありません（' + need + '個必要）');
        continue;
      }
      var picked = nums.slice(nums.length - need);
      if (no === null && nums.length > need) {
        var lead = nums[nums.length - need - 1];
        if (lead > game.max) { no = lead; }
      }
      var ok = true;
      var seen = {};
      for (var j = 0; j < picked.length; j++) {
        var v = picked[j];
        if (!(v >= 1 && v <= game.max) || seen[v]) { ok = false; break; }
        seen[v] = 1;
      }
      if (!ok) {
        errs.push((i + 1) + '行目: 1〜' + game.max + 'の重複なしの数字として読めません（' + picked.join(',') + '）');
        continue;
      }
      out.push({
        no: no,
        date: date,
        main: picked.slice(0, game.main).sort(asc),
        bonus: picked.slice(game.main).sort(asc)
      });
    }
    return { draws: out, errors: errs };
  }

  function importText() {
    var game = g();
    var r = parseDraws(pasteText, game);
    var blocks = parseBlocks(pasteText, game);
    var usedBlocks = false;
    if (blocks.length > r.draws.length) {
      r = { draws: blocks, errors: [] };
      usedBlocks = true;
    }
    if (r.draws.length === 0) {
      alert('読み取れた回がありません。\n' + (r.errors.slice(0, 5).join('\n') || '形式を確認してください。'));
      return;
    }
    var list = r.draws;
    var hasNo = true;
    for (var i = 0; i < list.length; i++) {
      if (typeof list[i].no !== 'number') { hasNo = false; }
    }
    if (!hasNo) {
      if (state.pasteOrder === 'old') { list.reverse(); }
    } else {
      list.sort(function (a, b) { return b.no - a.no; });
    }
    var added = mergeInto(game.key, list);
    var merged = state.data[game.key];
    pasteText = '';
    save();
    render();
    var dup = r.draws.length - added;
    var msg = r.draws.length + '件読込 ／ ' + added + '件新規追加';
    if (dup > 0) { msg += ' ／ ' + dup + '件取込済（重複）'; }
    msg += '\n保有 ' + merged.length + '件';
    if (r.errors.length) { msg += '\n読み飛ばし ' + r.errors.length + '行:\n' + r.errors.slice(0, 5).join('\n'); }
    alert(msg);
  }

  function mergeInto(gameKey, incoming) {
    var list = incoming.concat(state.data[gameKey]);
    var seen = {};
    var uniq = [];
    for (var i = 0; i < list.length; i++) {
      var key = drawKey(list[i]);
      if (seen[key]) { continue; }
      seen[key] = 1;
      uniq.push(list[i]);
    }
    var before = state.data[gameKey].length;
    state.data[gameKey] = sortDraws(uniq);
    return state.data[gameKey].length - before;
  }

  function calcFreq(win, game) {
    var main = [];
    var bonus = [];
    var i;
    for (i = 0; i <= game.max; i++) { main.push(0); bonus.push(0); }
    for (i = 0; i < win.length; i++) {
      var d = win[i];
      for (var j = 0; j < d.main.length; j++) { main[d.main[j]] += 1; }
      for (var k = 0; k < d.bonus.length; k++) { bonus[d.bonus[k]] += 1; }
    }
    var all = [];
    for (i = 0; i <= game.max; i++) { all.push(main[i] + bonus[i]); }
    return { main: main, bonus: bonus, all: all };
  }

  function groupByCount(counts, game) {
    var map = {};
    for (var n = 1; n <= game.max; n++) {
      var c = counts[n];
      if (!map[c]) { map[c] = []; }
      map[c].push(n);
    }
    var keys = Object.keys(map).map(Number).sort(function (a, b) { return b - a; });
    return keys.map(function (c) { return { count: c, nums: map[c] }; });
  }

  function runsOf(sorted) {
    var runs = [];
    var cur = [sorted[0]];
    for (var i = 1; i < sorted.length; i++) {
      if (sorted[i] === sorted[i - 1] + 1) { cur.push(sorted[i]); }
      else { runs.push(cur); cur = [sorted[i]]; }
    }
    runs.push(cur);
    return runs;
  }

  function tailGroups(nums) {
    var map = {};
    for (var i = 0; i < nums.length; i++) {
      var t = nums[i] % 10;
      if (!map[t]) { map[t] = []; }
      map[t].push(nums[i]);
    }
    var gs = [];
    Object.keys(map).forEach(function (t) {
      if (map[t].length >= 2) { gs.push({ tail: Number(t), nums: map[t] }); }
    });
    gs.sort(function (a, b) { return b.nums.length - a.nums.length; });
    return gs;
  }

  function calcConditions() {
    var game = g();
    var all = draws();
    var n = winSize();
    var res = {
      n: n,
      comparable: 0,
      carryDist: {},
      carryTotal: 0,
      consecDist: { none: 0, p1: 0, p2: 0, t3: 0, q4: 0 },
      consecAny: 0,
      consec3: 0,
      tailDist: { none: 0, p1: 0, p2: 0, t3: 0 },
      tailAny: 0,
      tail3: 0,
      sums: [],
      odds: [],
      rows: []
    };
    for (var i = 0; i < n; i++) {
      var d = all[i];
      var s = d.main.slice().sort(asc);
      var row = { d: d, carry: null, runs: [], tails: [], sum: sum(s), odd: 0 };
      for (var z = 0; z < s.length; z++) { if (s[z] % 2 === 1) { row.odd += 1; } }
      res.sums.push(row.sum);
      res.odds.push(row.odd);

      if (i + 1 < all.length) {
        var prev = all[i + 1];
        var pset = {};
        for (var a = 0; a < prev.main.length; a++) { pset[prev.main[a]] = 1; }
        if (state.carryWithBonus) {
          for (var b = 0; b < prev.bonus.length; b++) { pset[prev.bonus[b]] = 1; }
        }
        var hits = s.filter(function (x) { return pset[x] === 1; });
        row.carry = hits;
        res.comparable += 1;
        res.carryTotal += hits.length;
        res.carryDist[hits.length] = (res.carryDist[hits.length] || 0) + 1;
      }

      var runs = runsOf(s).filter(function (r) { return r.length >= 2; });
      row.runs = runs;
      var maxRun = 0;
      for (var r1 = 0; r1 < runs.length; r1++) { maxRun = Math.max(maxRun, runs[r1].length); }
      if (maxRun >= 4) { res.consecDist.q4 += 1; }
      else if (maxRun === 3) { res.consecDist.t3 += 1; }
      else if (maxRun === 2 && runs.length >= 2) { res.consecDist.p2 += 1; }
      else if (maxRun === 2) { res.consecDist.p1 += 1; }
      else { res.consecDist.none += 1; }
      if (maxRun >= 2) { res.consecAny += 1; }
      if (maxRun >= 3) { res.consec3 += 1; }

      var tg = tailGroups(s);
      row.tails = tg;
      var maxTail = 0;
      var pairs2 = 0;
      for (var t1 = 0; t1 < tg.length; t1++) {
        maxTail = Math.max(maxTail, tg[t1].nums.length);
        if (tg[t1].nums.length === 2) { pairs2 += 1; }
      }
      if (maxTail >= 3) { res.tailDist.t3 += 1; }
      else if (maxTail === 2 && pairs2 >= 2) { res.tailDist.p2 += 1; }
      else if (maxTail === 2) { res.tailDist.p1 += 1; }
      else { res.tailDist.none += 1; }
      if (maxTail >= 2) { res.tailAny += 1; }
      if (maxTail >= 3) { res.tail3 += 1; }

      res.rows.push(row);
    }
    res.sumMin = res.sums.length ? Math.min.apply(null, res.sums) : 0;
    res.sumMax = res.sums.length ? Math.max.apply(null, res.sums) : 0;
    res.sumAvg = res.sums.length ? sum(res.sums) / res.sums.length : 0;
    res.oddMin = res.odds.length ? Math.min.apply(null, res.odds) : 0;
    res.oddMax = res.odds.length ? Math.max.apply(null, res.odds) : 0;
    res.oddAvg = res.odds.length ? sum(res.odds) / res.odds.length : 0;
    res.game = game;
    return res;
  }

  function chips(nums, cls) {

  function heatClass(c, max) {

    var r = c / max;
    if (c === 0) { return 'h0'; }
    if (r >= 0.85) { return 'h4'; }
    if (r >= 0.65) { return 'h3'; }
    if (r >= 0.45) { return 'h2'; }
    return 'h1';
  }

      + '<option value="main"' + (state.freqTarget === 'main' ? ' selected' : '') + '>本数字のみ</option>'
      + '<option value="bonus"' + (state.freqTarget === 'bonus' ? ' selected' : '') + '>ボーナスのみ</option>'
      + '<option value="all"' + (state.freqTarget === 'all' ? ' selected' : '') + '>本数字＋ボーナス</option>'
      + '</select></div>';

    h += '</div>';

    h += '<h3 class="sub">頻度帯の組み合わせ</h3>';
    var compC = bandComposition(game);
    h += '<p class="note">各回の本数字が、加熱帯・標準帯・低頻度帯から何個ずつ出ていたかです。予想タブはこの実績から構成を抽せんします。</p>';
    h += compTable(compC);

    h += '<h3 class="sub">回別の明細</h3>';
    h += '<div class="scroll"><table class="tb"><thead><tr><th class="l">回</th><th class="l">本数字</th><th>引っ張り</th><th>連続</th><th>末尾</th><th>合計</th><th>奇</th></tr></thead><tbody>';
    for (var r = 0; r < c.rows.length; r++) {
      var row = c.rows[r];
      var runTxt = row.runs.length === 0 ? '-' : row.runs.map(function (x) { return x.map(pad2).join('-'); }).join(' / ');
      var tailTxt = row.tails.length === 0 ? '-' : row.tails.map(function (x) { return x.nums.map(pad2).join('・'); }).join(' / ');
      h += '<tr><td class="l">' + (typeof row.d.no === 'number' ? row.d.no : (row.d.date || '-')) + '</td>'
        + '<td class="l">' + row.d.main.map(pad2).join(' ') + '</td>'
        + '<td>' + (row.carry === null ? '-' : (row.carry.length + (row.carry.length ? '（' + row.carry.map(pad2).join(',') + '）' : ''))) + '</td>'
        + '<td>' + runTxt + '</td><td>' + tailTxt + '</td><td>' + row.sum + '</td><td>' + row.odd + '</td></tr>';
    }
    h += '</tbody></table></div>';
    h += '</div>';
    return h;
  }

  function sampleDist(dist, fallback) {
    var keys = Object.keys(dist);
    var total = 0;
    var i;
    for (i = 0; i < keys.length; i++) { total += dist[keys[i]]; }
    if (total <= 0) { return fallback; }
    var r = Math.random() * total;
    for (i = 0; i < keys.length; i++) {
      r -= dist[keys[i]];
      if (r < 0) { return Number(keys[i]); }
    }
    return Number(keys[keys.length - 1]);
  }

  var BANDS = [
    { key: 'hot', label: '加熱帯' },
    { key: 'mid', label: '標準帯' },
    { key: 'cold', label: '低頻度帯' }
  ];

  /*
   * 対象期間の本数字の出現回数から、数字を3つの帯に分けます。
   * 境目は理論期待値 ± 標準偏差の半分。
   * 期待値 = 対象回数 × 本数字の個数 ÷ 数字の総数
   */
  function bandInfo(win, game) {
    var counts = calcFreq(win, game).main;
    var n = win.length;
    var p = game.main / game.max;
    var e = n * p;
    var sd = Math.sqrt(n * p * (1 - p));
    var hi = e + sd * 0.5;
    var lo = e - sd * 0.5;
    var band = [];
    var groups = { hot: [], mid: [], cold: [] };
    for (var i = 0; i <= game.max; i++) { band.push(null); }
    for (i = 1; i <= game.max; i++) {
      var c = counts[i];
      var b = c > hi ? 'hot' : (c < lo ? 'cold' : 'mid');
      band[i] = b;
      groups[b].push(i);
    }
    return { counts: counts, n: n, e: e, sd: sd, hi: hi, lo: lo, band: band, groups: groups };
  }

  function bandPattern(nums, bi) {
    var p = { hot: 0, mid: 0, cold: 0 };
    for (var i = 0; i < nums.length; i++) {
      var b = bi.band[nums[i]];
      if (b) { p[b] += 1; }
    }
    return p;
  }

  function patternKey(p) { return p.hot + '-' + p.mid + '-' + p.cold; }

  /*
   * 各回が、どの帯から何個ずつ出ていたかを数えます。
   * 帯はその回より前のデータだけで決めます。対象期間にその回自身を含めると、
   * 当せん番号は自分自身で出現回数が1増えるぶん必ず上の帯へ押し上げられ、
   * 加熱帯が1個ぶん水増しされるためです（予想するときの条件とも一致しません）。
   * 数えるのは、直前のデータが対象回数ぶんそろった回だけです。窓が短いと帯の母数
   * そのものが変わり（ロト6の10回窓では加熱帯が17.9個、200回窓では12.6個）、
   * 短い窓の回ほど加熱帯が多めに出て、予想で使う帯と条件が合わなくなるためです。
   */
  function bandComposition(game) {
    var all = draws();
    var n = winSize();
    var map = {};
    var used = 0;
    var span = n;
    var shortWin = false;
    var approx = false;
    var i;

    function add(pattern) {
      var key = patternKey(pattern);
      if (!map[key]) {
        map[key] = { hot: pattern.hot, mid: pattern.mid, cold: pattern.cold, count: 0 };
      }
      map[key].count += 1;
      used += 1;
    }

    /* 直前 size 回がそろった回だけを、その size 回で判定した帯で数えます */
    function collect(size) {
      for (var k = 0; k < size; k++) {
        var back = all.slice(k + 1, k + 1 + size);
        if (back.length < size) { break; }
        add(bandPattern(all[k].main, bandInfo(back, game)));
      }
    }

    collect(n);

    if (used < n) {
      /*
       * 対象回数ぶんの標本がそろわないときは、取れるだけ短い窓に全部そろえ直します。
       * 窓 w での標本は min(w, 保有 - w) 件なので、窓と標本数の両方がそろうには
       * 保有が窓の2倍（12回なら24件、24回なら48件）必要です。窓を保有の半分にすると
       * その条件をちょうど満たし、標本の数も一番多く取れます。
       */
      var half = Math.floor(all.length / 2);
      if (half >= 10 && half > used) {
        map = {};
        used = 0;
        shortWin = true;
        span = half;
        collect(half);
      }
    }

    if (used === 0) {
      /* 履歴が足りないときだけ、対象期間そのもので代用します（加熱帯が多めに出ます） */
      approx = true;
      var bi = bandInfo(all.slice(0, n), game);
      for (i = 0; i < n; i++) { add(bandPattern(all[i].main, bi)); }
    }

    var list = Object.keys(map).map(function (key) { return map[key]; });
    list.sort(function (a, b) { return b.count - a.count || b.hot - a.hot; });
    return { list: list, used: used, span: span, win: n, total: all.length, shortWin: shortWin, approx: approx };
  }

  function sampleComposition(comp) {
    var list = comp.list;
    var total = 0;
    var i;
    for (i = 0; i < list.length; i++) { total += list[i].count; }
    if (total <= 0) { return null; }
    var r = Math.random() * total;
    for (i = 0; i < list.length; i++) {
      r -= list[i].count;
      if (r < 0) { return list[i]; }
    }
    return list[list.length - 1];
  }

  /* 指定された帯の構成どおりに、帯の中から等確率で数字を選びます */
  function pickByBands(bi, target) {
    var out = [];
    for (var b = 0; b < BANDS.length; b++) {
      var key = BANDS[b].key;
      var need = target[key];
      var pool = bi.groups[key].slice();
      if (pool.length < need) { return null; }
      for (var k = 0; k < need; k++) {
        var idx = Math.floor(Math.random() * pool.length);
        out.push(pool[idx]);
        pool.splice(idx, 1);
      }
    }
    return out.sort(asc);
  }

  function evalSet(s, prevSet, bi) {
    var runs = runsOf(s).filter(function (r) { return r.length >= 2; });
    var maxRun = 0;
    for (var i = 0; i < runs.length; i++) { maxRun = Math.max(maxRun, runs[i].length); }
    var tg = tailGroups(s);
    var carry = 0;
    for (var j = 0; j < s.length; j++) { if (prevSet[s[j]] === 1) { carry += 1; } }
    var odd = 0;
    for (var k = 0; k < s.length; k++) { if (s[k] % 2 === 1) { odd += 1; } }
    return {
      runs: runs, maxRun: maxRun, tails: tg, carry: carry, odd: odd,
      sum: sum(s), bands: bandPattern(s, bi)
    };
  }

  /* 予想を作るための材料を1か所にまとめます（1口ずつの作り直しでも同じ材料を使います） */
  function predictContext() {
    var game = g();
    var win = windowDraws();
    if (win.length < 2) { return null; }
    var c = calcConditions();
    var bi = bandInfo(win, game);
    var comp = bandComposition(game);
    var prev = draws()[0];
    var prevSet = {};
    var i;
    for (i = 0; i < prev.main.length; i++) { prevSet[prev.main[i]] = 1; }
    if (state.carryWithBonus) {
      for (i = 0; i < prev.bonus.length; i++) { prevSet[prev.bonus[i]] = 1; }
    }

    var manual = null;
    var error = null;
    if (state.bandMode === 'manual') {
      manual = { hot: state.bandHot, mid: state.bandMid, cold: state.bandCold };
      if (manual.hot + manual.mid + manual.cold !== game.main) {
        error = '帯ごとの個数の合計を' + game.main + '個にしてください。';
      } else {
        for (var b = 0; b < BANDS.length; b++) {
          var key = BANDS[b].key;
          if (manual[key] > bi.groups[key].length) {
            error = BANDS[b].label + 'は' + bi.groups[key].length + '個しかないので、'
              + manual[key] + '個は選べません。';
            break;
          }
        }
      }
    }

    return {
      game: game,
      cond: c,
      bi: bi,
      comp: comp,
      prev: prev,
      prevSet: prevSet,
      manual: manual,
      error: error,
      pConsec: rate(c.consecAny, c.n) / 100,
      pTail: rate(c.tailAny, c.n) / 100,
      sumLo: Math.floor(c.sumMin - (c.sumMax - c.sumMin) * 0.08),
      sumHi: Math.ceil(c.sumMax + (c.sumMax - c.sumMin) * 0.08)
    };
  }

  /* 1口ぶんを作ります。seen に入っている組み合わせは避けます */
  function generateOne(ctx, seen) {
    var c = ctx.cond;
    var guard = 0;
    while (guard < 40) {
      guard += 1;
      var target = ctx.manual || sampleComposition(ctx.comp);
      if (!target) { return null; }
      var targetCarry = state.useCarry ? sampleDist(c.carryDist, 1) : null;
      var needConsec = state.useConsec ? (Math.random() < ctx.pConsec) : null;
      var needTail = state.useTail ? (Math.random() < ctx.pTail) : null;
      var relax = 0;
      while (relax <= 5) {
        for (var t = 0; t < 2500; t++) {
          var s = pickByBands(ctx.bi, target);
          if (!s) { break; }
          var ev = evalSet(s, ctx.prevSet, ctx.bi);
          if (relax < 5 && state.useSum && (ev.sum < ctx.sumLo || ev.sum > ctx.sumHi)) { continue; }
          if (relax < 4 && state.useOdd && (ev.odd < c.oddMin || ev.odd > c.oddMax)) { continue; }
          if (relax < 3 && needTail !== null && (ev.tails.length > 0) !== needTail) { continue; }
          if (relax < 2 && needConsec !== null && (ev.maxRun >= 2) !== needConsec) { continue; }
          if (relax < 1 && targetCarry !== null && ev.carry !== targetCarry) { continue; }
          if (seen[s.join('-')]) { continue; }
          return { nums: s, ev: ev, relax: relax, target: target };
        }
        relax += 1;
      }
    }
    return null;
  }

  function packResult(ctx, picks) {
    var relaxed = false;
    for (var i = 0; i < picks.length; i++) {
      if (picks[i].relax > 0) { relaxed = true; }
    }
    return {
      picks: picks, cond: ctx.cond, prev: ctx.prev, relaxed: relaxed,
      sumLo: ctx.sumLo, sumHi: ctx.sumHi, pConsec: ctx.pConsec, pTail: ctx.pTail,
      bi: ctx.bi, comp: ctx.comp
    };
  }

  function generatePicks() {
    var ctx = predictContext();
    if (!ctx) { return null; }
    if (ctx.error) { return { error: ctx.error, bi: ctx.bi, comp: ctx.comp }; }
    var picks = [];
    var seen = {};
    while (picks.length < state.predictCount) {
      var found = generateOne(ctx, seen);
      if (!found) { break; }
      seen[found.nums.join('-')] = 1;
      picks.push(found);
    }
    return packResult(ctx, picks);
  }

  /* 表示中の予想のうち、指定した1口だけを作り直します */
  function regenOne(index) {
    if (!lastPicks || lastPicks.game !== state.game) { return false; }
    var picks = lastPicks.result.picks;
    if (!picks || index < 0 || index >= picks.length) { return false; }
    var ctx = predictContext();
    if (!ctx || ctx.error) { return false; }
    var seen = {};
    var i;
    for (i = 0; i < picks.length; i++) { seen[picks[i].nums.join('-')] = 1; }
    /* 作り直したのに同じ組み合わせ、では分かりにくいので、いまの口も避けます */
    var found = generateOne(ctx, seen);
    if (!found) {
      /* 選べる組み合わせが少なく避けきれない場合だけ、いまの口を許します */
      seen = {};
      for (i = 0; i < picks.length; i++) {
        if (i !== index) { seen[picks[i].nums.join('-')] = 1; }
      }
      found = generateOne(ctx, seen);
    }
    if (!found) { return false; }
    var next = picks.slice();
    next[index] = found;
    lastPicks = { game: state.game, result: packResult(ctx, next) };
    return true;
  }

  function compTable(comp) {
    var h = '<table class="tb"><thead><tr><th class="l">加熱</th><th class="l">標準</th>'
      + '<th class="l">低頻度</th><th>回数</th><th>割合</th></tr></thead><tbody>';
    for (var i = 0; i < comp.list.length; i++) {
      var r = comp.list[i];
      h += '<tr><td class="l">' + r.hot + '個</td><td class="l">' + r.mid + '個</td>'
        + '<td class="l">' + r.cold + '個</td><td>' + r.count + '回</td>'
        + '<td>' + fx(rate(r.count, comp.used), 1) + '%</td></tr>';
    }
    h += '</tbody></table>';
    if (comp.approx) {
      h += '<p class="note" style="color:#b45309">履歴が足りないため、対象期間そのもので帯を決めて数えています。'
        + 'この数え方では当せん番号が自分自身で出現回数を1増やすぶん、加熱帯が多めに出ます。'
        + 'データを増やすと正しい数え方に切り替わります。</p>';
    } else if (comp.shortWin) {
      h += '<p class="note" style="color:#b45309">直前' + comp.win + '回で判定した標本が'
        + comp.win + '回ぶんそろわないため、'
        + '帯の判定を直前' + comp.span + '回にそろえて' + comp.used + '回ぶん数えています。'
        + '予想で使う帯は直前' + comp.win + '回で決めるので、構成のかたより方は少し変わります。'
        + (comp.win >= comp.total
          ? '集計対象を' + comp.span + '回以下にするか、データを増やすと、そろいます。'
          : '保有が' + (comp.win * 2) + '件になると、そろいます。')
        + '</p>';
    } else {
      h += '<p class="note">直前' + comp.span + '回がそろった' + comp.used + '回ぶんを集計しています。'
        + '各回の帯は、その回より前のデータだけで決めています'
        + '（その回自身を含めると加熱帯が1個ぶん水増しされるため）。'
        + '窓の長さがそろわない回は数えていません。</p>';
      if (comp.used < comp.win) {
        h += '<p class="note" style="color:#b45309">標本は' + comp.used + '回ぶんで、対象回数（'
          + comp.win + '回）には足りません。保有が' + (comp.win * 2) + '件になると、'
          + comp.win + '回ぶんそろいます。</p>';
      }
    }
    return h;
  }

  function bandChips(bi, key) {
    var nums = bi.groups[key];
    if (nums.length === 0) { return '<span class="muted" style="font-size:12px">なし</span>'; }
    var cls = key === 'hot' ? 'h4' : (key === 'mid' ? 'h2' : 'h0');
    return chips(nums, cls);
  }

  function bandSummary(bi, game) {
    var h = '<table class="tb"><thead><tr><th class="l">帯</th><th class="l">出現回数</th><th>個数</th></tr></thead><tbody>';
    var ranges = {
      hot: fx(bi.hi, 1) + '回 より多い',
      mid: fx(bi.lo, 1) + '回 〜 ' + fx(bi.hi, 1) + '回',
      cold: fx(bi.lo, 1) + '回 より少ない'
    };
    for (var b = 0; b < BANDS.length; b++) {
      var k = BANDS[b].key;
      h += '<tr><td class="l">' + BANDS[b].label + '</td><td class="l">' + ranges[k] + '</td>'
        + '<td>' + bi.groups[k].length + '個</td></tr>';
    }
    h += '</tbody></table>';
    h += '<p class="note">対象' + bi.n + '回での本数字の出現回数を、理論期待値 ' + fx(bi.e, 2)
      + '回 を中心に3つに分けています（境目は標準偏差 ' + fx(bi.sd, 2) + '回 の半分）。</p>';
    return h;
  }

  function viewPred() {
    var game = g();
    var win = windowDraws();
    var h = demoBanner();
    h += '<div class="card">';
    h += '<h2 class="sec">◎ 頻度帯による予想（' + game.label + '）</h2>';
    if (win.length < 2) {
      h += '<div class="empty">予想には2回分以上のデータが必要です。</div></div>';
      return h;
    }
    var bi = bandInfo(win, game);
    var comp = bandComposition(game);

    h += '<h3 class="sub">いまの頻度帯</h3>';
    h += bandSummary(bi, game);
    for (var b = 0; b < BANDS.length; b++) {
      h += '<p class="note" style="margin-top:8px">' + BANDS[b].label + '</p>';
      h += '<div class="chips">' + bandChips(bi, BANDS[b].key) + '</div>';
    }

    h += '<h3 class="sub">帯ごとの個数をどう決めるか</h3>';
    h += '<select data-set="bandMode">'
      + '<option value="auto"' + (state.bandMode === 'auto' ? ' selected' : '') + '>過去の構成どおりに抽せんする</option>'
      + '<option value="manual"' + (state.bandMode === 'manual' ? ' selected' : '') + '>自分で個数を決める</option>'
      + '</select>';
    if (state.bandMode === 'manual') {
      var total = state.bandHot + state.bandMid + state.bandCold;
      h += '<div class="row2" style="margin-top:8px">';
      var keys = ['bandHot', 'bandMid', 'bandCold'];
      for (var m = 0; m < BANDS.length; m++) {
        h += '<div><label class="fld">' + BANDS[m].label + '</label><select data-set="' + keys[m] + '">';
        for (var v = 0; v <= game.main; v++) {
          h += '<option value="' + v + '"' + (state[keys[m]] === v ? ' selected' : '') + '>' + v + '個</option>';
        }
        h += '</select></div>';
      }
      h += '</div>';
      h += '<p class="note"' + (total === game.main ? '' : ' style="color:#b91c1c"') + '>合計 ' + total
        + '個 / ' + game.main + '個' + (total === game.main ? '' : '（合計を' + game.main + '個にしてください）') + '</p>';
    } else {
      h += '<p class="note">過去' + comp.used + '回で実際にあった組み合わせの中から、出現した回数の多いものほど選ばれやすい形で抽せんします。'
        + '数えているのは、帯の判定に直前' + comp.span + '回ぶんがそろった回だけです。下の表がその内訳です。</p>';
      h += compTable(comp);
    }

    h += '<h3 class="sub">その他の設定</h3>';
    h += '<div class="row2">';
    h += '<div><label class="fld">口数</label><select data-set="predictCount">';
    for (var i = 1; i <= 10; i++) {
      h += '<option value="' + i + '"' + (state.predictCount === i ? ' selected' : '') + '>' + i + '口</option>';
    }
    h += '</select></div></div>';
    h += '<label class="fld">あわせて合わせる条件（②の集計に合わせます）</label>';
    h += '<div class="checks">'
      + '<label><input type="checkbox" data-set="useCarry"' + (state.useCarry ? ' checked' : '') + '>引っ張り個数</label>'
      + '<label><input type="checkbox" data-set="useConsec"' + (state.useConsec ? ' checked' : '') + '>連続数字</label>'
      + '<label><input type="checkbox" data-set="useTail"' + (state.useTail ? ' checked' : '') + '>末尾同一</label>'
      + '<label><input type="checkbox" data-set="useSum"' + (state.useSum ? ' checked' : '') + '>合計値レンジ</label>'
      + '<label><input type="checkbox" data-set="useOdd"' + (state.useOdd ? ' checked' : '') + '>奇数偶数バランス</label>'
      + '</div>';
    h += '<div style="margin-top:12px"><button class="btn wide" data-act="gen">予想を生成する</button></div>';

    if (lastPicks && lastPicks.game === state.game) {
      var r = lastPicks.result;
      if (r.error) {
        h += '<p class="note" style="color:#b91c1c">' + esc(r.error) + '</p>';
      } else {
        h += '<h3 class="sub">生成結果</h3>';
        h += '<p class="note">前回（' + (typeof r.prev.no === 'number' ? '第' + r.prev.no + '回' : '最新回') + '）: '
          + r.prev.main.map(pad2).join(' ') + ' / B ' + r.prev.bonus.map(pad2).join(' ') + '</p>';
        for (var p = 0; p < r.picks.length; p++) {
          var pick = r.picks[p];
          h += '<div class="pickrow"><div class="idx">' + (p + 1) + '口目</div>';
          h += '<div class="chips">' + chips(pick.nums, 'pick') + '</div>';
          var tailTxt = pick.ev.tails.length ? pick.ev.tails.map(function (x) { return x.nums.map(pad2).join('・'); }).join(' / ') : 'なし';
          var runTxt = pick.ev.runs.length ? pick.ev.runs.map(function (x) { return x.map(pad2).join('-'); }).join(' / ') : 'なし';
          h += '<div class="meta"><b>加熱 ' + pick.ev.bands.hot + '個 ／ 標準 ' + pick.ev.bands.mid
            + '個 ／ 低頻度 ' + pick.ev.bands.cold + '個</b></div>';
          h += '<div class="meta">引っ張り ' + pick.ev.carry + '個 ／ 連続 ' + runTxt + ' ／ 末尾一致 ' + tailTxt
            + ' ／ 合計 ' + pick.ev.sum + ' ／ 奇数 ' + pick.ev.odd + '個'
            + (pick.relax > 0 ? ' ／ <span style="color:#b45309">条件を一部緩和</span>' : '') + '</div>';
          h += '<div style="margin-top:6px"><button class="mini" data-act="regen" data-i="' + p + '">この口だけ作り直す</button></div>';
          h += '</div>';
        }
        h += '<div><button class="btn sub" data-act="copy">結果をコピー</button><button class="btn gray" data-act="gen">もう一度生成</button></div>';
        h += '<p class="note">適用レンジ: 合計 ' + r.sumLo + '〜' + r.sumHi + ' ／ 連続あり確率 '
          + fx(r.pConsec * 100, 1) + '% ／ 末尾一致あり確率 ' + fx(r.pTail * 100, 1) + '%</p>';
      }
    }
    h += '</div>';

    h += '<div class="card">';
    h += '<h2 class="sec">この予想の作り方</h2>';
    h += '<h3 class="sub">1. 数字を3つの帯に分ける</h3>';
    h += '<p class="note">対象' + win.length + '回での本数字の出現回数を見て、理論期待値（' + fx(bi.e, 2)
      + '回）より目立って多い数字を加熱帯、目立って少ない数字を低頻度帯、その間を標準帯とします。'
      + '境目は期待値 ± 標準偏差の半分（' + fx(bi.sd / 2, 2) + '回）です。ボーナス数字は帯の判定に使いません。</p>';
    h += '<h3 class="sub">2. 帯ごとの個数を決める</h3>';
    h += '<p class="note">当せん番号は加熱帯だけで揃うわけではなく、毎回いくつかの帯が混ざります。'
      + 'そこで過去の当せん番号が「加熱何個・標準何個・低頻度何個」で構成されていたかを数え、'
      + 'その実績の中から抽せんして今回の個数を決めます（上の表がその内訳）。自分で個数を決めることもできます。</p>';
    h += '<p class="note">このとき、各回の帯は<b>その回より前のデータだけ</b>で決めます。'
      + '対象期間にその回自身を含めると、当せん番号は自分で出現回数を1増やすぶん必ず上の帯へ押し上げられ、'
      + '加熱帯がちょうど1個ぶん水増しされてしまうためです。これから買う回はまだ抽せんされていないので、'
      + 'こちらが予想するときの条件と同じです。</p>';
    h += '<h3 class="sub">3. 帯の中から数字を選ぶ</h3>';
    h += '<p class="note">決まった個数だけ、それぞれの帯の中から<b>等確率</b>で選びます。'
      + '帯に分けた時点で出現回数の多い少ないは反映されているため、帯の中ではさらに重みを付けません。</p>';
    h += '<h3 class="sub">4. ②の集計に合う形か確かめる</h3>';
    h += '<p class="note">選んだ' + game.main + '個が②の傾向に合っているかを確認し、合わなければ選び直します（最大2500回）。'
      + 'チェックを外した項目は見ません。</p>';
    h += '<table class="tb"><thead><tr><th class="l">条件</th><th class="l">合わせ方</th></tr></thead><tbody>'
      + '<tr><td class="l">引っ張りの個数</td><td class="l">②の個数分布から抽せんし、その個数ちょうどにします</td></tr>'
      + '<tr><td class="l">連続数字</td><td class="l">②の「連続あり」の確率でくじを引き、その結果に合わせます</td></tr>'
      + '<tr><td class="l">末尾同一</td><td class="l">②の「末尾一致あり」の確率でくじを引き、その結果に合わせます</td></tr>'
      + '<tr><td class="l">合計値</td><td class="l">②の最小〜最大の範囲（前後8%の余裕つき）に収めます</td></tr>'
      + '<tr><td class="l">奇数の個数</td><td class="l">②の最小〜最大の範囲に収めます</td></tr>'
      + '</tbody></table>';
    h += '<p class="note">見つからないときは、引っ張り → 連続 → 末尾 → 奇数 → 合計 の順に条件を外して探します。'
      + '外したときは「条件を一部緩和」と表示します。帯の構成は外しません。</p>';
    h += '<h3 class="sub">5. 正直なところ</h3>';
    h += '<p class="note">やっているのは「過去の当せん番号と似た<b>形</b>の組み合わせを作る」ことだけです。'
      + '抽せんは毎回独立した事象なので、<b>この操作で当せん確率は上がりません</b>（どの組み合わせも確率は同じです）。'
      + '買い方の手がかりとしてお使いください。購入は自己責任でお願いします。</p>';
    h += '</div>';
    return h;
  }

  function viewInfo() {
    var h = '<div class="card">';
    h += '<h2 class="sec">アプリ情報</h2>';
    h += '<div class="kpi"><div><b>v' + APP_VERSION + '</b><span>アプリバージョン</span></div>'
      + '<div><b>' + state.data.loto6.length + '件</b><span>ロト6 保有データ</span></div>'
      + '<div><b>' + state.data.loto7.length + '件</b><span>ロト7 保有データ</span></div></div>';
    h += '<h3 class="sub">使い方</h3>';
    h += '<p class="note">1. 「データ」タブで、当せん番号の一覧ページをコピーして貼り付け、「取り込む」。月を切り替えて繰り返すと過去分が集まります。<br>'
      + '2. 「出現率」タブで ① 各数字の出現回数と、出現回数別のまとめを見ます。<br>'
      + '3. 「条件確率」タブで ② 引っ張り・連続・末尾同一などが過去に何回あったかを見ます。<br>'
      + '4. 「予想」タブで、①の頻度帯と②の集計に沿った買い目を作ります。</p>';
    h += '<h3 class="sub">集計のしかた</h3>';
    h += '<p class="note">・集計の対象は「最新回から遡って、選んだ回数分」です。回数は各タブの「集計対象」で切り替えます。<br>'
      + '・引っ張り＝その回の本数字のうち、直前回の本数字（設定によりボーナスも）に含まれていた個数。<br>'
      + '・連続数字＝昇順に並べたとき差が1の並び。3連続は2連続2組とは別に数えます。<br>'
      + '・末尾同一＝1の位が同じ数字のまとまり。3個一致は2個一致とは別に数えます。<br>'
      + '・頻度帯＝対象期間の本数字の出現回数を、理論期待値 ± 標準偏差の半分で3つに分けたもの。<br>'
      + '・データはこの端末のブラウザ内（localStorage）にだけ保存されます。</p>';
    h += '<h3 class="sub">この集計でわかること・わからないこと</h3>';
    h += '<p class="note">わかるのは「過去の当せん番号にどんな傾向があったか」だけです。'
      + '抽せんは毎回独立した事象なので、<b>集計する回数を増やしても次回の当たりやすさは変わりません</b>。'
      + 'どの組み合わせも当せん確率は同じです。</p>';
    h += '<h3 class="sub">バージョン履歴</h3>';
    h += '<table class="tb"><thead><tr><th class="l">版</th><th class="l">内容</th></tr></thead><tbody>';
    h += '<tr><td class="l">v1.53</td><td class="l">帯の組み合わせを、窓の長さと標本の数の両方がそろったときだけ対象回数どおりに数えるようにしました。そろわないときは窓を保有件数の半分にそろえ直します。対象12回なら保有24件、対象24回なら保有48件でそろいます。</td></tr>';
    h += '<tr><td class="l">v1.52</td><td class="l">頻度帯の組み合わせを数えるとき、帯の判定に対象回数ぶんの履歴がそろった回だけを使うようにしました。これまでは古い回ほど短い履歴で帯を決めており、短い窓では加熱帯の母数が膨らむぶん、実績が加熱帯寄りに出ていました。保有データが対象回数の2倍に足りないときは、取れるだけ短い窓に全部そろえて数え、その旨を表示します。</td></tr>';
    h += '<tr><td class="l">v1.51</td><td class="l">当せん番号の自動取得の仕組みを削除しました。みずほ銀行がGitHub Actionsからの接続を拒否するため実現できず、v1.30でアプリ側の読み込みも廃止していたためです。取り込みは一覧ページの貼り付けだけになります。</td></tr>';
    h += '<tr><td class="l">v1.50</td><td class="l">生成した予想を1口ずつ作り直せるようにしました。他の口はそのまま残ります。</td></tr>';
    h += '<tr><td class="l">v1.41</td><td class="l">頻度帯の組み合わせを数えるとき、その回自身を含めていたのを修正しました。当せん番号は自分で出現回数を1増やすため、加熱帯がちょうど1個ぶん水増しされていました。各回の帯は、その回より前のデータだけで決めます。</td></tr>';
    h += '<tr><td class="l">v1.40</td><td class="l">予想を頻度帯（加熱帯・標準帯・低頻度帯）による方式に作り替えました。過去の当せん番号が各帯から何個ずつ出ていたかを数え、その構成に合わせて選びます。個数を自分で決めることもできます。ダミーデータ生成と、誤解を招く説明文を削除しました。</td></tr>';
    h += '<tr><td class="l">v1.30</td><td class="l">回ごとに1行の一覧表（第2139回 2026/9/21 03 06 … の形）も貼り付けられるようにしました。スラッシュ区切りの日付を当せん番号として読み違える不具合を修正。取り込みは常に追加のみにし、保存済みJSONの読み込みと手入力を廃止。予想タブに計算方法の説明を追加しました。</td></tr>';
    h += '<tr><td class="l">v1.20</td><td class="l">みずほの「抽せん数字一覧表」をブラウザでコピーして、そのまま貼り付けられるようにしました。1か月分がまとめて入ります。GitHub Actions からの自動取得はみずほ側に拒否されるため、通常はこちらを使います。</td></tr>';
    h += '<tr><td class="l">v1.14</td><td class="l">みずほへの接続が拒否された（403）ため、一般的なブラウザと同じ要求ヘッダで取得するように変更。</td></tr>';
    h += '<tr><td class="l">v1.13</td><td class="l">取得元の指定を分かりやすく変更。既定で同じ場所の data/ を読むようにし、みずほのURLが入っていた場合は警告して戻せるようにしました。ワークフローは push でも動くようにし、ブランチのままでも取得できます。</td></tr>';
    h += '<tr><td class="l">v1.12</td><td class="l">過去回の取得方法を月別ページ（index.html?year=2026&amp;month=8 形式）を遡る方式に変更。既知の回に追いつくと打ち切るため、日々の取得は1リクエストで済みます。</td></tr>';
    h += '<tr><td class="l">v1.11</td><td class="l">取得先URLをみずほの「抽せん数字一覧表」（takarakuji/check/loto/…）に修正。月別ページの見出しにある回号を誤って取り込まないよう解析を検証し、過去回ページの巡回を改善。</td></tr>';
    h += '<tr><td class="l">v1.10</td><td class="l">みずほ銀行の当せん番号を自動取得する仕組みを追加。GitHub Actions が1日1回取得したJSONをアプリから読み込みます（起動時の自動取得にも対応）。</td></tr>';
    h += '<tr><td class="l">v1.00</td><td class="l">初版。データ取り込み、①出現回数・出現率、②条件別出現確率（引っ張り／連続／末尾同一／合計／奇偶）、統計ベース予想、ロト6・ロト7対応、PWA対応。</td></tr>';
    h += '</tbody></table>';
    h += '<p class="note">更新のたびに v1.01, v1.02 … と繰り上げます（大きな機能追加は v1.10、仕様変更は v2.00）。</p>';
    h += '</div>';
    return h;
  }

  function render() {
    var h = '';
    h += '<header class="app"><div class="hrow"><div class="title">ロト統計アナライザー</div>'
      + '<div class="ver">v' + APP_VERSION + '</div></div>';
    h += '<div class="seg">';
    ['loto6', 'loto7'].forEach(function (k) {
      h += '<button data-act="game" data-g="' + k + '" class="' + (state.game === k ? 'on' : '') + '">' + GAMES[k].label + '</button>';
    });
    h += '</div></header><main>';
    if (state.tab === 'data') { h += viewData(); }
    else if (state.tab === 'freq') { h += viewFreq(); }
    else if (state.tab === 'cond') { h += viewCond(); }
    else if (state.tab === 'pred') { h += viewPred(); }
    else { h += viewInfo(); }
    h += '</main><nav class="tabs">';
    for (var i = 0; i < TABS.length; i++) {
      h += '<button data-act="tab" data-t="' + TABS[i].key + '" class="' + (state.tab === TABS[i].key ? 'on' : '') + '">'
        + '<em>' + TABS[i].icon + '</em>' + TABS[i].label + '</button>';
    }
    h += '</nav>';
    $('app').innerHTML = h;
    var pt = $('paste');
    if (pt) {
      pt.addEventListener('input', function () { pasteText = pt.value; });
    }
  }

  function download(name, text, type) {
    try {
      var blob = new Blob([text], { type: type });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = name;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 1500);
    } catch (e) {
      alert('書き出しに失敗しました。');
    }
  }

  function exportCsv() {
    var game = g();
    var lines = ['no,date,' + game.label + '_main,bonus'];
    var all = draws();
    for (var i = 0; i < all.length; i++) {
      var d = all[i];
      lines.push([(typeof d.no === 'number' ? d.no : ''), (d.date || ''), '"' + d.main.map(pad2).join(' ') + '"', '"' + d.bonus.map(pad2).join(' ') + '"'].join(','));
    }
    download(game.key + '_data.csv', lines.join('\n'), 'text/csv');
  }

  function copyPicks() {
    if (!lastPicks) { return; }
    var game = g();
    var txt = game.label + ' 予想（v' + APP_VERSION + '）\n';
    var r = lastPicks.result;
    for (var i = 0; i < r.picks.length; i++) {
      txt += (i + 1) + ': ' + r.picks[i].nums.map(pad2).join(' ') + '\n';
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(function () { alert('コピーしました。'); }, function () { alert(txt); });
    } else {
      var ta = document.createElement('textarea');
      ta.value = txt;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); alert('コピーしました。'); }
      catch (e) { alert(txt); }
      document.body.removeChild(ta);
    }
  }

  document.addEventListener('click', function (e) {
    var t = e.target;
    while (t && t !== document && !(t.getAttribute && t.getAttribute('data-act'))) { t = t.parentNode; }
    if (!t || t === document || !t.getAttribute) { return; }
    var act = t.getAttribute('data-act');
    if (act === 'tab') { state.tab = t.getAttribute('data-t'); save(); render(); }
    else if (act === 'game') { state.game = t.getAttribute('data-g'); lastPicks = null; save(); render(); }
    else if (act === 'import') { importText(); }
    else if (act === 'del-row') {
      var i = parseInt(t.getAttribute('data-i'), 10);
      state.data[state.game].splice(i, 1);
      save();
      render();
    }
    else if (act === 'clear') {
      if (confirm(g().label + 'のデータを全て消去します。よろしいですか？')) {
        state.data[state.game] = [];
        lastPicks = null;
        save();
        render();
      }
    }
    else if (act === 'export-json') { download(state.game + '_data.json', JSON.stringify(draws(), null, 1), 'application/json'); }
    else if (act === 'export-csv') { exportCsv(); }
    else if (act === 'gen') {
      var res = generatePicks();
      if (!res) { alert('予想には2回分以上のデータが必要です。'); return; }
      if (res.error) {
        lastPicks = { game: state.game, result: res };
        render();
        return;
      }
      if (res.picks.length === 0) {
        alert('条件に合う組み合わせを作れませんでした。条件を減らしてください。');
        return;
      }
      lastPicks = { game: state.game, result: res };
      render();
    }
    else if (act === 'regen') {
      var ri = parseInt(t.getAttribute('data-i'), 10);
      if (regenOne(ri)) { render(); }
      else { alert('条件に合う組み合わせを作れませんでした。条件を減らしてください。'); }
    }
    else if (act === 'copy') { copyPicks(); }
  });

  document.addEventListener('change', function (e) {
    var t = e.target;
    if (!t || !t.getAttribute) { return; }
    var key = t.getAttribute('data-set');
    if (!key) { return; }
    if (t.type === 'checkbox') { state[key] = t.checked; }
    else if (key === 'windowSize' || key === 'predictCount') { state[key] = parseInt(t.value, 10); }
    else { state[key] = t.value; }
    save();
    render();
  });

  load();
  render();

  if ('serviceWorker' in navigator && String(location.protocol).indexOf('http') === 0) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () { });
    });
  }
}());
</script>
</body>
</html>
